name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  physics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run the physics test suite
        run: node --test test/physics.test.mjs
