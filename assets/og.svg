<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Haulcheck — tractive effort, adhesion and heat calculator for Derail Valley">
  <title>Haulcheck</title>

  <!-- Palette and type taken from css/style.css. Nothing new is invented here:
       the preview has to look like the page it links to. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2126"/>
      <stop offset="1" stop-color="#15181c"/>
    </linearGradient>
    <linearGradient id="pole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262b32"/>
      <stop offset="1" stop-color="#1d2126"/>
    </linearGradient>
    <style>
      .display { font-family: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif; font-weight: 700; }
      .mono    { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace; }
      .body    { font-family: "Barlow", system-ui, -apple-system, "Helvetica Neue", sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#ground)"/>

  <!-- the sign, as drawn in the page: 2:1, blue third, sloped face -->
  <g>
    <!-- pole first, so the sign sits over it -->
    <rect x="302" y="382" width="16" height="86" fill="url(#pole)" rx="2"/>

    <rect x="100" y="172" width="420" height="210" fill="#0b0d10" rx="4"/>
    <rect x="106" y="178" width="141" height="198" fill="#103a5e"/>
    <rect x="247" y="178" width="267" height="198" fill="#e4a928"/>

    <!-- the gradient line, at the same 12,76 → 88,24 the page uses -->
    <line x1="279" y1="329" x2="482" y2="225"
          stroke="#0b0d10" stroke-width="7" stroke-linecap="round" opacity="0.5"/>

    <text x="380" y="277" class="display" font-size="68" fill="#0b0d10"
          text-anchor="middle" dominant-baseline="central">+2.2</text>
  </g>

  <!-- the plate, with the masthead's yellow rule -->
  <rect x="600" y="168" width="6" height="152" fill="#e4a928"/>

  <text x="628" y="197" class="mono" font-size="21" fill="#a8a396" letter-spacing="4.6">DVRT · UNOFFICIAL</text>
  <text x="624" y="300" class="display" font-size="106" fill="#e8e4da" letter-spacing="-1">HAULCHECK</text>

  <text x="628" y="368" class="body" font-size="33" fill="#a8a396">Will this train climb that grade?</text>

  <!-- The three limits the tool exists to tell apart, in the colours the page
       already assigns to grip and to trouble. -->
  <g class="mono" font-size="27" letter-spacing="2.4">
    <text x="628" y="440" fill="#e8e4da">PULL</text>
    <text x="722" y="440" fill="#4a5058">/</text>
    <text x="752" y="440" fill="#5a9367">GRIP</text>
    <text x="846" y="440" fill="#4a5058">/</text>
    <text x="876" y="440" fill="#b33a2b">HEAT</text>
  </g>

  <text x="628" y="492" class="body" font-size="23" fill="#6f6f68">Tonnage calculator for Derail Valley</text>

  <line x1="100" y1="548" x2="1100" y2="548" stroke="#262b32" stroke-width="2"/>
  <text x="100" y="586" class="mono" font-size="21" fill="#6f6f68">ilbeca.github.io/dv-haulcheck</text>
  <text x="1100" y="586" class="mono" font-size="21" fill="#6f6f68" text-anchor="end">unofficial fan tool</text>
</svg>
